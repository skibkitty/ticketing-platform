# Development-only override: publish the internal services to the host so they
# can be debugged with curl, an IDE, or a tool that speaks HTTP directly.
#
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up --build
#
# This is a deliberate exception to ADR 012, and the exception is the whole
# point of keeping it in its own file: `docker compose up` reads only
# docker-compose.yml, so the normal path cannot publish an internal port even by
# accident. Read this before using it.
#
# A published port is a way around the gateway. The gateway is the only place
# that checks a signature and a role (ADR 002), and notification-service trusts
# the identity it is handed and checks no role of its own (ADR 011), so
# `curl localhost:8084/api/v1/admin/customers/42/notifications` reads a
# Customer's Notifications with no token at all. Loopback is the best that can be
# done for a debugging convenience — it keeps a colleague on the LAN out — and
# it is not a control. Any process on this machine, including anything running
# as this user, can still make that call.
#
# So: bound to loopback, never to 0.0.0.0, and take it back down when the
# debugging is done (`docker compose ... down`, which drops the published ports
# with the containers). InternalServiceExposureTests checks that the bindings
# here stay on 127.0.0.1 and that this file is the only place they exist.
services:
  reservation-service:
    ports:
      - "127.0.0.1:8082:8080"

  payment-service:
    ports:
      - "127.0.0.1:8083:8080"

  notification-service:
    ports:
      - "127.0.0.1:8084:8080"
