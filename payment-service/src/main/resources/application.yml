spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platform?currentSchema=payment}
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:platform}
  flyway:
    schemas: payment
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    listener:
      # Per-record offsets so a poison record can be retried and dead-lettered
      # without re-delivering its batch siblings (ADR 008).
      ack-mode: record

app:
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
  payment:
    decline-threshold-cents: ${PAYMENT_DECLINE_THRESHOLD_CENTS:50000}
  kafka:
    topics:
      reservation-created: ${RESERVATION_EVENTS_TOPIC:reservation.events.v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# One JSON object per line, with the MDC's correlationId as a top-level field,
# so one request is followed across every service by grepping its id (#14).
# Boot's own formatter: no encoder dependency, and stack traces stay inside
# the object as stack_trace instead of spilling onto lines of their own.
logging:
  structured:
    format:
      console: logstash
