services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    volumes:
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - platform-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # KRaft mode: no ZooKeeper container needed.
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2@sha256:8f2ff02d64b0a7a2b71b6b3b3148b85f66d00ec20ad40c30bdcd415d46d31818
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  reservation-service:
    build:
      context: .
      dockerfile: reservation-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/platform?currentSchema=reservation
      DB_USER: platform
      DB_PASSWORD: platform
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # Internal service: reachable only from this machine, never from the network.
    # ADR 002 puts trust in the gateway's forwarded identity header on network hygiene --
    # nothing but our own services may reach this port -- so the binding is to loopback,
    # not to every interface. Host-side debugging (curl localhost:8082) still works; a
    # colleague on the LAN forging that header does not.
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/platform?currentSchema=payment
      DB_USER: platform
      DB_PASSWORD: platform
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Deterministic failure rule for reproducible demos rather than pure
      # randomness: reservations at or above this amount simulate a declined
      # payment, so the compensating (seat-release) path is easy to trigger
      # on purpose when demoing.
      PAYMENT_DECLINE_THRESHOLD_CENTS: 50000
    # Internal service: reachable only from this machine, never from the network.
    # ADR 002 puts trust in the gateway's forwarded identity header on network hygiene --
    # nothing but our own services may reach this port -- so the binding is to loopback,
    # not to every interface. Host-side debugging (curl localhost:8082) still works; a
    # colleague on the LAN forging that header does not.
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/platform?currentSchema=notification
      DB_USER: platform
      DB_PASSWORD: platform
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # Internal service: reachable only from this machine, never from the network.
    # ADR 002 puts trust in the gateway's forwarded identity header on network hygiene --
    # nothing but our own services may reach this port -- so the binding is to loopback,
    # not to every interface. Host-side debugging (curl localhost:8082) still works; a
    # colleague on the LAN forging that header does not.
    ports:
      - "127.0.0.1:8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      RESERVATION_SERVICE_URL: http://reservation-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # No signing key and no demo passwords are committed. A default here would
      # be a credential in version control that passes the gateway's own
      # length check and signs every token in a deployment that never chose one
      # (ADR 002). `:?` makes Compose stop with the variable's name rather than
      # substituting an empty string and leaving the gateway to fail later.
      #
      #   cp .env.example .env    # then fill in the four values
      #
      # The gateway still enforces its own minimum length on JWT_SECRET, so a
      # too-short value fails at startup with a message that says why.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - copy .env.example to .env and generate one with 'openssl rand -base64 48'}
      DEMO_CUSTOMER_PASSWORD: ${DEMO_CUSTOMER_PASSWORD:?DEMO_CUSTOMER_PASSWORD is not set - copy .env.example to .env and fill it in}
      DEMO_ORGANIZER_PASSWORD: ${DEMO_ORGANIZER_PASSWORD:?DEMO_ORGANIZER_PASSWORD is not set - copy .env.example to .env and fill it in}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?DEMO_ADMIN_PASSWORD is not set - copy .env.example to .env and fill it in}
    ports:
      - "8080:8080"
    depends_on:
      - reservation-service
      - payment-service
      - notification-service

volumes:
  platform-db-data:
