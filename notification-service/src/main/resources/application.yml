spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platform?currentSchema=notification}
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:platform}
  flyway:
    schemas: notification
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    # No producer of our own: the only thing ever sent from this service is the
    # dead-letter copy a poison record is quarantined as (ADR 008).
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    listener:
      # Per-record offsets so a poison record can be retried and dead-lettered
      # without re-delivering its batch siblings (ADR 008).
      ack-mode: record
    admin:
      # The service provisions its own topic + DLT via KafkaAdmin on startup
      # (see KafkaTopicConfig); no reliance on broker auto-creation.
      auto-create: true

app:
  kafka:
    topics:
      # Shared with payment-service: same topic, different consumer group.
      reservation-events: ${RESERVATION_EVENTS_TOPIC:reservation.events.v1}
    topic-partitions: ${RESERVATION_TOPIC_PARTITIONS:1}
    topic-replicas: ${RESERVATION_TOPIC_REPLICAS:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
